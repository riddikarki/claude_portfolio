<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nepal Portfolio Agents</title>
<style>
  :root{
    --bg:#f6f4ef; --panel:#ffffff; --ink:#20242a; --muted:#7a7f87;
    --accent:#0f6b5c; --accent-ink:#ffffff; --line:#e4e0d6; --user:#e8f0ee;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#15181c; --panel:#1e2228; --ink:#e8e6e1; --muted:#8b9097;
           --accent:#2fa08c; --accent-ink:#0c1512; --line:#2c313a; --user:#233631; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.55 system-ui,"Segoe UI",Roboto,sans-serif;
       display:flex;flex-direction:column;height:100dvh;}
  header{padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;
         border-bottom:1px solid var(--line);background:var(--panel);
         display:flex;align-items:center;gap:10px;}
  header h1{font-size:15px;margin:0;font-weight:600}
  header .status{font-size:12px;color:var(--muted);margin-left:auto}
  #log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;}
  .msg{max-width:min(680px,92%);padding:10px 14px;border-radius:12px;
       white-space:pre-wrap;overflow-wrap:break-word;}
  .user{align-self:flex-end;background:var(--user);border:1px solid var(--line);}
  .agent{align-self:flex-start;background:var(--panel);border:1px solid var(--line);}
  .meta{font-size:11px;color:var(--muted);align-self:flex-start;padding:0 4px;}
  .thinking{color:var(--muted);font-style:italic}
  form{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));
       border-top:1px solid var(--line);background:var(--panel);}
  textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:10px;
           padding:10px 12px;font:inherit;background:var(--bg);color:var(--ink);
           min-height:44px;max-height:140px;}
  button{border:0;border-radius:10px;padding:0 18px;background:var(--accent);
         color:var(--accent-ink);font:600 14px system-ui;cursor:pointer;}
  button:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>
<header>
  <h1>Nepal Portfolio Agents</h1>
  <span class="status" id="status">ready</span>
</header>
<div id="log"></div>
<form id="form">
  <textarea id="box" placeholder="Ask the CEO agent… (Enter to send, Shift+Enter for a new line)" rows="1"></textarea>
  <button id="send" type="submit">Send</button>
</form>
<script>
(function(){
  var log = document.getElementById('log'),
      form = document.getElementById('form'),
      box = document.getElementById('box'),
      send = document.getElementById('send'),
      status = document.getElementById('status');

  var key = null;
  try { key = localStorage.getItem('portfolio_key'); } catch(e){}
  if (!key) {
    key = prompt('Access key (PORTFOLIO_UI_KEY from the server .env):') || '';
    try { localStorage.setItem('portfolio_key', key); } catch(e){}
  }

  var sessionId = null;
  try { sessionId = sessionStorage.getItem('portfolio_session'); } catch(e){}
  if (!sessionId) {
    sessionId = 's-' + Date.now() + '-' + Math.random().toString(36).slice(2,8);
    try { sessionStorage.setItem('portfolio_session', sessionId); } catch(e){}
  }

  function add(cls, text){
    var d = document.createElement('div');
    d.className = 'msg ' + cls;
    d.textContent = text;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
    return d;
  }

  box.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var text = box.value.trim();
    if (!text || send.disabled) return;
    add('user', text);
    box.value = '';
    send.disabled = true;
    status.textContent = 'working…';
    var wait = add('agent thinking', 'Working — routing to the right specialist…');

    fetch('/chat', {
      method: 'POST',
      headers: {'Content-Type':'application/json', 'X-Portfolio-Key': key},
      body: JSON.stringify({session_id: sessionId, message: text})
    }).then(function(r){
      if (r.status === 401) {
        try { localStorage.removeItem('portfolio_key'); } catch(e){}
        throw new Error('Wrong access key — reload the page and enter it again.');
      }
      if (!r.ok) return r.json().then(function(j){ throw new Error(j.detail || r.statusText); });
      return r.json();
    }).then(function(j){
      wait.remove();
      add('agent', j.reply);
      if (j.cost_usd != null) {
        var m = document.createElement('div');
        m.className = 'meta';
        m.textContent = 'turn cost: $' + Number(j.cost_usd).toFixed(4) +
                        ' (0 on the Max plan token)';
        log.appendChild(m);
      }
    }).catch(function(err){
      wait.remove();
      add('agent', 'Error: ' + err.message);
    }).finally(function(){
      send.disabled = false;
      status.textContent = 'ready';
      box.focus();
    });
  });

  box.focus();
})();
</script>
</body>
</html>
